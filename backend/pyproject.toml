[project]
name = "boardhub-backend"
version = "0.1.0"
description = "API do BoardHub (FastAPI)."
requires-python = ">=3.13,<3.14"   # DT-014
# Limites inferiores = séries maiores em uso; versões exatas ficam em uv.lock (gerado pelo CI — DT-012).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]   # assert é permitido em testes

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"alembic/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
